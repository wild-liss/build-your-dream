<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>LOG IN</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="head-img">
        <img src="images/sota-1.png">
        <img src="images/sota-2.png">
    </div>
    <div class="box-position">
        <div class="promo">
            <a href="cover-page.html">BUILD YOUR DREAM</a>
        </div>
        <div class="box">
            <div class="user">
                <img src="images/user-icon.png">
            </div>
            <form>
                <div class="input">
                    <label for="email">Email</label>
                    <input class="input-style" required type="email" id="email" name="email" placeholder="example@gmail.com">
                    <label for="password">Password</label>
                    <input class="input-style" required type="password" id="password" name="password" placeholder="********">
                </div>
                <input class="submit" type="submit">
            </form>
            <div class="links">
                <a href="#">Forget password?</a>
                <a href="sign-up.html">Sign up</a>
            </div>
        </div>
    </div>
</body>
</html>
