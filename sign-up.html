<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SIGN UP</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/sing_up.css">
</head>
<body>
<div class="head-img">
  <img src="images/sota-1.png">
  <img src="images/sota-2.png">
</div>
<div class="box-position">
  <div class="promo">
    <a href="cover-page.html">BUILD YOUR DREAM</a>
  </div>
  <div class="box">
    <div class="user">
      <img src="images/user-icon.png">
    </div>
    <form>
      <div class="input">
        <label for="name">Nickname</label>
        <input class="input-style" required type="text" id="name" name="name" placeholder="Casper">
        <label for="email">Email</label>
        <input class="input-style" required type="email" id="email" name="email" placeholder="example@gmail.com">
        <label for="password">Password</label>
        <input class="input-style" required type="password" id="password" name="password" placeholder="********">
        <label for="confirm-password">Re-enter password</label>
        <input class="input-style" required type="password" id="confirm-password" name="password_confirmation" placeholder="********">
      </div>
      <input class="submit" type="submit">
    </form>
  </div>
</div>
</body>
</html>
